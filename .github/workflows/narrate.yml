name: Narrate video scripts
on:
  push:
    paths: ["narration/**/script.txt", "narration/**/voice.txt"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder to narrate, e.g. narration/2026-12-01-stairs"
        required: true
permissions:
  contents: write
jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find scripts to narrate
        id: find
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            echo "dirs=${{ github.event.inputs.folder }}" >> "$GITHUB_OUTPUT"
          else
            dirs=$(git diff --name-only HEAD~1 HEAD -- 'narration/**/script.txt' 'narration/**/voice.txt' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          fi
      - name: Narrate
        if: steps.find.outputs.dirs != ''
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for d in ${{ steps.find.outputs.dirs }}; do python tools/narrate.py "$d"; done
      - name: Commit audio
        if: steps.find.outputs.dirs != ''
        run: |
          git config user.name "cam-narrator"
          git config user.email "actions@users.noreply.github.com"
          git add narration
          git diff --cached --quiet || git commit -m "Narration audio [skip ci]"
          git push
